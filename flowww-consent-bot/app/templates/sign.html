{% extends "base.html" %}
{% block title %}Firmar consentimiento{% endblock %}
{% block content %}
  <h1>Consentimiento informado</h1>
  {% if progress_label %}<p><em>{{ progress_label }}</em></p>{% endif %}
  <h3>{{ consent.template.treatment_name }}</h3>
  <div class="consent-text">{{ consent.template.body_text }}</div>

  <form class="stack" method="post" action="{{ sign_action_url }}" id="sign-form">
    <label>Nombre completo (como firma)</label>
    <input type="text" name="signer_name" required value="{{ consent.patient.full_name }}">

    <label>Firma (dibuja con el dedo o el ratón)</label>
    <canvas id="signature-pad" width="600" height="180"></canvas>
    <p><a href="#" id="clear-signature">Borrar y firmar de nuevo</a></p>
    <input type="hidden" name="signature_data" id="signature_data" required>

    <p style="margin-top:20px;">
      <button class="btn" type="submit">Firmar y aceptar</button>
    </p>
  </form>

  <script>
    const canvas = document.getElementById('signature-pad');
    const ctx = canvas.getContext('2d');
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#2c2530';
    let drawing = false;

    function pos(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
    }

    function start(e) { drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }
    function move(e) { if (!drawing) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); }
    function end() { drawing = false; }

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start);
    canvas.addEventListener('touchmove', move);
    canvas.addEventListener('touchend', end);

    document.getElementById('clear-signature').addEventListener('click', (e) => {
      e.preventDefault();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    document.getElementById('sign-form').addEventListener('submit', (e) => {
      const blank = document.createElement('canvas');
      blank.width = canvas.width; blank.height = canvas.height;
      if (canvas.toDataURL() === blank.toDataURL()) {
        alert('Por favor firma antes de continuar.');
        e.preventDefault();
        return;
      }
      document.getElementById('signature_data').value = canvas.toDataURL('image/png');
    });
  </script>
{% endblock %}
