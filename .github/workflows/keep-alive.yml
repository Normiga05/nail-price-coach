name: Keep app awake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visit the app so Streamlit Cloud doesn't put it to sleep
        run: curl --silent --show-error --fail --max-time 30 "https://nail-price-coach-norja.streamlit.app/" -o /dev/null
